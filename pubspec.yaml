name: pana_workspace
description: >-
  Scores the packages of a pub workspace with pana before they are published,
  resolving sibling packages from the checkout, and fails when one loses
  pub.dev points.
version: 0.1.0
repository: https://github.com/bluefireteam/pana_workspace
issue_tracker: https://github.com/bluefireteam/pana_workspace/issues
topics:
  - pana
  - workspace
  - monorepo
  - ci

environment:
  sdk: ^3.11.0

executables:
  pana_workspace:

dependencies:
  args: ^2.7.0
  glob: ^2.2.0
  logging: ^1.3.0
  pana: ^0.23.19
  path: ^1.9.1
  tar: ^2.0.3
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
  melos: ^8.10.1

melos:
  useRootAsPackage: true
  command:
    version:
      branch: main
      workspaceChangelog: false
      includeCommitId: true
      linkToCommits: true
